<!doctype html>
<html lang="{{ page.lang | default: site.lang }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ page.description | default: site.description }}">
  <link rel="icon" href="{{ '/assets/favicon.svg' | relative_url }}" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  <style>
    :root { --bg:#F2EBDD; --text:#22201C; --muted:#5E584B; --accent:#E9B949; --rule:#D9CFBC; --card:#FFFFFF; }
    @media (prefers-color-scheme: dark) {
      :root { --bg:#1B1A17; --text:#F2EBDD; --muted:#B5AC9A; --accent:#E9B949; --rule:#3A372F; --card:#24221E; }
      .logo circle, .logo line { stroke: #F2EBDD; }
    }
    * { box-sizing: border-box; }
    body { margin:0; background:var(--bg); color:var(--text);
           font: 17px/1.6 "Space Grotesk", system-ui, sans-serif; }
    .wrap { max-width: 760px; margin: 0 auto; padding: 32px 16px 64px; }
    header { display:flex; justify-content:space-between; align-items:center; gap:16px; flex-wrap:wrap;
             padding-bottom:20px; margin-bottom:40px; border-bottom:1.5px solid var(--rule); }
    .brand { display:flex; align-items:center; gap:10px; color:var(--text); text-decoration:none;
             font-weight:700; font-size:22px; letter-spacing:-0.03em; }
    .logo { width:30px; height:30px; flex:none; }
    nav a { color:var(--muted); text-decoration:none; margin-left:18px; font-family:"Space Mono", monospace; font-size:14px; }
    nav a:hover, nav a[aria-current="page"] { color:var(--text); }
    a { color:var(--text); text-decoration-color:var(--accent); text-decoration-thickness:2px; text-underline-offset:3px; }
    h1 { font-size:44px; line-height:1.05; letter-spacing:-0.04em; margin:0 0 16px; }
    h2 { font-size:20px; letter-spacing:-0.02em; margin:40px 0 8px; }
    p, li { max-width: 62ch; }
    code { font-family:"Space Mono", monospace; font-size:0.9em; background:var(--card); padding:1px 6px; border-radius:6px; }
    .lead { font-size:21px; color:var(--muted); margin-top:0; }
    .label { font-family:"Space Mono", monospace; font-size:13px; text-transform:uppercase; letter-spacing:0.1em; color:var(--muted); }
    .pill { display:inline-block; padding:3px 10px; border-radius:999px; background:var(--accent); color:#22201C;
            font-family:"Space Mono", monospace; font-size:12px; font-weight:700; }
    .card { display:block; background:var(--card); border:1.5px solid var(--text); border-radius:16px; padding:22px;
            text-decoration:none; color:var(--text); margin:16px 0; }
    .card:hover { border-color: var(--muted); }
    .card h3 { margin:10px 0 6px; font-size:24px; letter-spacing:-0.02em; }
    .card p { margin:0; color:var(--muted); }
    .button { display:inline-block; padding:10px 18px; border-radius:999px; background:var(--text); color:var(--bg);
              text-decoration:none; font-weight:500; }
    .terminal { background:#0F120E; color:#E4DFD3; border-radius:16px; padding:20px 22px;
                font-family:"Space Mono", monospace; font-size:15px; line-height:1.8; overflow-x:auto; }
    .terminal .k { color:#C6F432; } .terminal .d { color:#7C8C58; }
    footer { border-top:1.5px solid var(--rule); margin-top:56px; padding-top:18px; font-size:14px; color:var(--muted);
             display:flex; flex-wrap:wrap; gap:8px 20px; }
    footer a { color:var(--muted); }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <a class="brand" href="{{ '/' | relative_url }}">
        <svg class="logo" viewBox="0 0 64 64" aria-hidden="true"><circle cx="32" cy="32" r="28" fill="none" stroke="#22201C" stroke-width="4"/><path d="M32 4a28 28 0 0 1 0 56z" fill="#E9B949"/><line x1="32" y1="4" x2="32" y2="60" stroke="#22201C" stroke-width="4"/></svg>
        half batch
      </a>
      <nav aria-label="Main">
        <a href="{{ '/kipple/' | relative_url }}"{% if page.url contains '/kipple/' %} aria-current="page"{% endif %}>kipple</a>
        <a href="{{ '/#about' | relative_url }}">about</a>
      </nav>
    </header>
    <main>
      {{ content }}
    </main>
    <footer>
      <span>© {{ 'now' | date: '%Y' }} Half Batch</span>
      <a href="mailto:{{ site.owner.email }}">{{ site.owner.email }}</a>
      <a href="{{ '/privacy/' | relative_url }}">Privacy</a>
      <a href="{{ '/impressum/' | relative_url }}">Impressum</a>
    </footer>
  </div>
</body>
</html>
